<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- 原子轨道 logo：电子绕核运动 -->
  <g transform="translate(64 64)">
    <!-- 三条交叉轨道 -->
    <ellipse rx="52" ry="22" stroke="#00B8D9" stroke-width="3.5"/>
    <ellipse rx="52" ry="22" stroke="#00B8D9" stroke-width="3.5" transform="rotate(60)"/>
    <ellipse rx="52" ry="22" stroke="#00B8D9" stroke-width="3.5" transform="rotate(120)"/>
    <!-- 原子核 -->
    <circle r="9" fill="#1A2E35"/>
    <circle r="4" fill="#C47F3D"/>
    <!-- 电子 -->
    <circle cx="52" cy="0" r="5" fill="#1A2E35"/>
    <circle cx="-26" cy="45" r="5" fill="#1A2E35"/>
    <circle cx="-26" cy="-45" r="5" fill="#1A2E35"/>
  </g>
</svg>
